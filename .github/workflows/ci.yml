# Runs on every push to main and every pull request once the repository is on GitHub.
# Uses a throwaway Postgres service container; the credentials below exist only inside CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: job_agent
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: job_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U job_agent -d job_agent_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql://job_agent:ci_only_password@localhost:5432/job_agent_test
      TURBO_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable pnpm (version pinned in package.json)
        run: corepack enable pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format, lint, typecheck, unit tests
        run: pnpm check

      - name: Production build
        run: pnpm build

      - name: Integration tests (migrates the test database first)
        run: pnpm test:integration

      - name: End-to-end tests
        run: pnpm test:e2e
